<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Umut Uygur portfolio. Computer Engineer, backend, AI, cloud and CI/CD projects."
    />
    <title>Umut Uygur | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:wght@400;500;600&family=Libre+Franklin:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="portfolio-data.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="page-shell" data-theme="light">
      <header class="site-header">
        <a class="brand" href="/">Umut Uygur</a>
        <div class="header-actions">
          <div class="segmented" aria-label="Language">
            <button class="seg-option active" type="button" data-lang="tr">TR</button>
            <button class="seg-option" type="button" data-lang="en">EN</button>
          </div>
          <button class="outline-button" type="button" data-theme-toggle>Gece</button>
          <a class="outline-button accent" href="assets/umut-uygur-cv.pdf" target="_blank" rel="noopener">CV</a>
        </div>
      </header>

      <main class="page-main">
        <section class="hero">
          <div class="hero-plate">
            <img src="assets/portfolio-hero.png" alt="" />
            <div class="hero-wash"></div>
            <div class="hero-copy">
              <h1>Umut Uygur</h1>
              <div class="hero-meta">
                <span data-i18n="role">Bilgisayar Muhendisi</span>
                <a href="assets/umut-uygur-cv.pdf" target="_blank" rel="noopener" data-i18n="cvLine">CV'yi goruntule</a>
              </div>
            </div>
          </div>
        </section>

        <section class="ticker-row" aria-live="polite">
          <span class="ticker-dot"></span>
          <span class="ticker-label" data-i18n="tickerLabel">Secilmis calismalar</span>
          <span class="ticker-name" data-ticker>CI/CD Dagitim Hatti</span>
        </section>

        <section class="projects-section" id="projects">
          <div class="section-head">
            <h2 data-i18n="projects">Projeler</h2>
            <span class="project-count" data-project-count>00</span>
          </div>
          <div class="project-list" data-project-list></div>
        </section>

        <section class="contact-strip" id="contact">
          <span data-i18n="elsewhere">Iletisim</span>
          <a href="mailto:umuttuygurr@gmail.com">umuttuygurr@gmail.com</a>
          <a href="https://github.com/umutuygur0" target="_blank" rel="noopener">GitHub</a>
          <a href="https://www.linkedin.com/in/umut-uygur-24b920249" target="_blank" rel="noopener">LinkedIn</a>
        </section>
      </main>
    </div>
  </body>
</html>
