name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.ECR_REPO }}:latest .

      - name: Push Docker image to Amazon ECR
        run: |
          docker push ${{ secrets.ECR_REPO }}:latest
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Allow GitHub Actions runner SSH access
        id: allow_ssh
        shell: bash
        run: |
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '\r\n')"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

          set +e
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" 2> aws-error.log
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            if grep -q "InvalidPermission.Duplicate" aws-error.log; then
              echo "SSH rule already exists for $RUNNER_IP"
            else
              cat aws-error.log
              exit "$STATUS"
            fi
          fi

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_EC2 }}
          script: |
            docker compose pull
            docker compose up -d --force-recreate

      - name: Revoke GitHub Actions runner SSH access
        if: always() && steps.allow_ssh.outputs.runner_ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.allow_ssh.outputs.runner_ip }}/32" || true
